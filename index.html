<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORCE VECTOR ADVENTURE</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-light: #f8fafc;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* Views */
    .view-container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Card & UI Components */
    .glass-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      width: 100%;
      margin-bottom: 20px;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn:disabled {
      background: #475569;
      cursor: not-allowed;
      transform: none;
    }

    /* Game HUD */
    .hud-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 20px;
      margin-bottom: 20px;
    }

    .player-card {
      flex: 1;
      background: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.3s;
    }

    .player-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }

    .player-icon img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #334155;
    }

    /* Inventory Items */
    .inventory-box {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      min-height: 35px;
      justify-content: center;
    }

    .inv-item-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .inv-item-btn:hover:not(:disabled) {
      background: var(--accent);
      color: #0f172a;
    }

    .inv-item-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty-inv {
      font-size: 12px;
      color: #94a3b8;
    }

    /* 3D Dice */
    .dice-container {
      perspective: 600px;
      margin: 20px 0;
    }

    .dice {
      width: 60px;
      height: 60px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s ease-out;
    }

    .dice-face {
      position: absolute;
      width: 60px;
      height: 60px;
      background: white;
      border: 2px solid #ccc;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #0f172a;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Menu View -->
  <div id="view-menu" class="view-container">
    <div class="glass-card" style="text-align: center;">
      <h1 style="font-size: 2.5rem; margin-bottom: 20px; color: var(--accent);">FORCE VECTOR ADVENTURE</h1>
      <p style="margin-bottom: 20px;">ศึกสงครามหุ่นนักรบ พิชิตโจทย์แรงลัพธ์</p>
      <button class="btn" onclick="switchView('view-room')">เข้าสู่เกม</button>
    </div>
  </div>

  <!-- Room View -->
  <div id="view-room" class="view-container hidden">
    <div class="glass-card">
      <h2>สร้างหรือเข้าร่วมห้อง</h2>
      <input type="text" id="room-code-input" placeholder="กรอกรหัสห้อง (เช่น 1234)">
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn" style="flex:1;" onclick="joinRoom('P1')">สร้างห้อง (P1)</button>
        <button class="btn" style="flex:1;" onclick="joinRoom('P2')">เข้าร่วมห้อง (P2)</button>
      </div>
    </div>
  </div>

  <!-- Game View -->
  <div id="view-game" class="view-container hidden">
    <!-- HUD -->
    <div class="hud-container">
      <div id="p1-card" class="player-card">
        <div id="p1-card-icon" class="player-icon"></div>
        <h3 id="p1-card-name">P1</h3>
        <p id="p1-card-title" style="font-size: 12px; color: #94a3b8;"></p>
        <p>💎 คริสตัล: <span id="p1-crystal">0</span></p>
        <div id="p1-inventory" class="inventory-box"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <h2 id="turn-display" style="color: var(--accent);">รอผู้เล่น...</h2>
        <div class="dice-container">
          <div id="dice" class="dice">
            <div class="dice-face">🎲</div>
          </div>
        </div>
        <button id="btn-roll" class="btn" onclick="rollDice()" disabled>ทอยลูกเต๋า</button>
      </div>

      <div id="p2-card" class="player-card">
        <div id="p2-card-icon" class="player-icon"></div>
        <h3 id="p2-card-name">P2</h3>
        <p id="p2-card-title" style="font-size: 12px; color: #94a3b8;"></p>
        <p>💎 คริสตัล: <span id="p2-crystal">0</span></p>
        <div id="p2-inventory" class="inventory-box"></div>
      </div>
    </div>

    <div class="glass-card" style="text-align: center;">
      <h3>กระดานการเดินทาง</h3>
      <p id="board-status" style="margin-top: 10px; color: #94a3b8;">ตำแหน่งผู้เล่นกำลังโหลด...</p>
      <button class="btn" style="margin-top: 15px; background: #334155;" onclick="openShopModal()">🛒 ร้านค้าไอเทม</button>
    </div>
  </div>

  <!-- Question Modal -->
  <div id="modal-question" class="modal-overlay hidden">
    <div class="modal-content">
      <div id="modal-choice-view">
        <h3>เลือกระดับความท้าทาย</h3>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button class="btn" style="flex:1; background: var(--success);" onclick="triggerSelectChallenge('easy')">ง่าย (+10💎)</button>
          <button class="btn" style="flex:1; background: var(--accent);" onclick="triggerSelectChallenge('medium')">ปานกลาง (+20💎)</button>
          <button class="btn" style="flex:1; background: var(--danger);" onclick="triggerSelectChallenge('hard')">ยาก (+30💎)</button>
        </div>
      </div>

      <div id="modal-question-view" class="hidden">
        <span id="modal-realm-tag" style="background: var(--primary); padding: 4px 8px; border-radius: 4px; font-size: 12px;"></span>
        <h3 id="q-text" style="margin: 20px 0;">โจทย์แรงลัพธ์...</h3>
        <input type="number" id="q-answer" placeholder="คำตอบ (นิวตัน)">
        <button class="btn" onclick="submitAnswer()">ส่งคำตอบ</button>
      </div>
    </div>
  </div>

  <!-- Shop Modal -->
  <div id="modal-shop" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>ร้านค้าไอเทม</h3>
      <div id="shop-items-list" style="margin: 20px 0; text-align: left;"></div>
      <button class="btn" onclick="closeShopModal()">ปิด</button>
    </div>
  </div>

  <script>
    // --- Firebase Initialization (จำลองการตั้งค่า) ---
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForTemplateCode12345",
      authDomain: "force-vector-game.firebaseapp.com",
      databaseURL: "https://force-vector-game-default-rtdb.firebaseio.com",
      projectId: "force-vector-game",
      storageBucket: "force-vector-game.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // --- Audio Context (Sound Effects) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'roll') {
          osc.frequency.setValueAtTime(300, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) { console.log("Audio not supported or blocked"); }
    }

    // --- Game Constants ---
    const ROBOTS = [
      { name: "Vector Prime", image: "https://via.placeholder.com/60/4f46e5/ffffff?text=R1" },
      { name: "Force Buster", image: "https://via.placeholder.com/60/ef4444/ffffff?text=R2" }
    ];

    const SHOP_ITEMS = [
      { id: "item_shield", name: "🛡️ โล่ป้องกัน", cost: 15, desc: "ป้องกันการเสียคริสตัลเมื่อตอบผิด" },
      { id: "item_double", name: "🎲 เต๋าคูณสอง", cost: 20, desc: "เดินได้ระยะทางเป็น 2 เท่าในตานี้" },
      { id: "item_crystal_boost", name: "💎 ถุงคริสตัล", cost: 25, desc: "รับ 10 คริสตัลทันที" },
      { id: "item_teleport", name: "🚀 วาร์ปหน้า", cost: 30, desc: "ก้าวไปข้างหน้า 2 ช่องทันที" }
    ];

    // --- State Variables ---
    let myRole = null; 
    let currentRoomCode = null;
    let currentDifficulty = 'easy';
    let gameState = {
      turn: 0,
      players: [
        { name: "Player 1", robotIdx: 0, pos: 0, crystal: 0, inventory: [] },
        { name: "Player 2", robotIdx: 1, pos: 0, crystal: 0, inventory: [] }
      ],
      currentQuestion: null
    };

    // --- Navigation ---
    function switchView(viewId) {
      document.querySelectorAll('.view-container').forEach(el => el.classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
    }

    // --- Firebase Sync ---
    function joinRoom(role) {
      const code = document.getElementById('room-code-input').value.trim();
      if (!code) return alert("กรุณากรอกรหัสห้อง!");

      myRole = role;
      currentRoomCode = code;

      const roomRef = db.ref('rooms/' + currentRoomCode);
      
      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          gameState = data;
          updateGameHUD();
          updateBoardUI();
        } else {
          updateRoomDB();
        }
      });

      switchView('view-game');
    }

    function updateRoomDB() {
      if (currentRoomCode) {
        db.ref('rooms/' + currentRoomCode).set(gameState);
      }
    }

    // --- HUD & UI Updates ---
    function updateGameHUD() {
      if (!gameState || !gameState.players) return;

      const p1 = gameState.players[0];
      const p2 = gameState.players[1];

      document.getElementById('p1-card-name').innerText = p1.name || 'Player 1';
      document.getElementById('p1-card-title').innerText = ROBOTS[p1.robotIdx]?.name || '';
      document.getElementById('p1-card-icon').innerHTML = `<img src="${ROBOTS[p1.robotIdx]?.image}" onerror="this.src='https://via.placeholder.com/60?text=R1'">`;
      document.getElementById('p1-crystal').innerText = p1.crystal || 0;

      document.getElementById('p2-card-name').innerText = p2.name || 'Player 2';
      document.getElementById('p2-card-title').innerText = ROBOTS[p2.robotIdx]?.name || '';
      document.getElementById('p2-card-icon').innerHTML = `<img src="${ROBOTS[p2.robotIdx]?.image}" onerror="this.src='https://via.placeholder.com/60?text=R2'">`;
      document.getElementById('p2-crystal').innerText = p2.crystal || 0;

      // Render ช่องเก็บไอเทม (Inventory)
      renderInventory('p1-inventory', p1, 0);
      renderInventory('p2-inventory', p2, 1);

      document.getElementById('p1-card').classList.toggle('active', gameState.turn === 0);
      document.getElementById('p2-card').classList.toggle('active', gameState.turn === 1);

      document.getElementById('turn-display').innerText = `ตาของ: ${gameState.players[gameState.turn]?.name || ''}`;

      const myTurn = (myRole === 'P1' && gameState.turn === 0) || (myRole === 'P2' && gameState.turn === 1);
      document.getElementById('btn-roll').disabled = !myTurn;
    }

    function renderInventory(containerId, player, pIdx) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';

      if (!player.inventory || player.inventory.length === 0) {
        container.innerHTML = '<span class="empty-inv">กระเป๋าว่าง</span>';
        return;
      }

      player.inventory.forEach((itemId, itemIdx) => {
        const itemData = SHOP_ITEMS.find(i => i.id === itemId);
        if (!itemData) return;

        const btn = document.createElement('button');
        btn.className = 'inv-item-btn';
        btn.innerText = itemData.name;
        
        const isMyTurn = (myRole === 'P1' && gameState.turn === 0 && pIdx === 0) ||
                         (myRole === 'P2' && gameState.turn === 1 && pIdx === 1);
        btn.disabled = !isMyTurn;
        btn.onclick = () => useShopItem(itemIdx);

        container.appendChild(btn);
      });
    }

    function useShopItem(itemIdx) {
      const pIdx = gameState.turn;
      const player = gameState.players[pIdx];
      const itemId = player.inventory[itemIdx];
      
      if (!itemId) return;

      if (itemId === 'item_shield') {
        player.shield = true;
        alert('🛡️ เปิดใช้งานโล่ป้องกันแล้ว!');
      } else if (itemId === 'item_double') {
        player.doubleDice = true;
        alert('🎲 เปิดใช้งานเต๋าคูณสอง!');
      } else if (itemId === 'item_crystal_boost') {
        player.crystal = (player.crystal || 0) + 10;
        alert('💎 ได้รับ 10 คริสตัลทันที!');
      } else if (itemId === 'item_teleport') {
        player.pos = Math.min(30, player.pos + 2);
        alert('🚀 วาร์ปข้างหน้า 2 ช่อง!');
      }

      player.inventory.splice(itemIdx, 1);
      updateRoomDB();
    }

    function updateBoardUI() {
      const p1 = gameState.players[0];
      const p2 = gameState.players[1];
      document.getElementById('board-status').innerText = `${p1.name} อยู่ที่ช่อง ${p1.pos} | ${p2.name} อยู่ที่ช่อง ${p2.pos}`;
    }

    // --- Gameplay Mechanics ---
    function rollDice() {
      playSound('roll');
      const pIdx = gameState.turn;
      const player = gameState.players[pIdx];

      let step = Math.floor(Math.random() * 6) + 1;
      if (player.doubleDice) {
        step *= 2;
        player.doubleDice = false;
      }

      player.pos += step;
      alert(`คุณได้ ${step} แต้ม! เดินไปที่ช่อง ${player.pos}`);

      document.getElementById('modal-choice-view').classList.remove('hidden');
      document.getElementById('modal-question-view').classList.add('hidden');
      document.getElementById('modal-question').classList.remove('hidden');

      updateRoomDB();
    }

    function getRealm(pos) {
      return { icon: "⚔️", type: "perpendicular", name: "สมรภูมิแรงตั้งฉาก" };
    }

    // --- Physics Question Generator ---
    function generateQuestion(type, diff) {
      let f1 = 3, f2 = 4, angle = 90, ans = 5;

      if (diff === 'easy') {
        // Parallel or Anti-parallel
        if (Math.random() > 0.5) {
          f1 = 10; f2 = 5; angle = 0; ans = 15;
        } else {
          f1 = 12; f2 = 4; angle = 180; ans = 8;
        }
      } else if (diff === 'medium') {
        // Perpendicular (Pythagorean triples)
        f1 = 6; f2 = 8; angle = 90; ans = 10;
      } else {
        // Angled forces: R = sqrt(F1^2 + F2^2 + 2*F1*F2*cos(theta))
        f1 = 5; f2 = 3; angle = 60; // 5^2 + 3^2 + 2(5)(3)(0.5) = 25 + 9 + 15 = 49 -> sqrt = 7
        ans = 7;
      }

      return {
        text: `แรง F1 = ${f1} N และ F2 = ${f2} N ทำมุม ${angle}° ต่อกัน จงหาขนาดของแรงลัพธ์?`,
        ans: ans
      };
    }

    function triggerSelectChallenge(diff) {
      currentDifficulty = diff;
      document.getElementById('modal-choice-view').classList.add('hidden');
      document.getElementById('modal-question-view').classList.remove('hidden');

      const pIdx = gameState.turn;
      const currentPos = gameState.players[pIdx].pos;
      const realm = getRealm(currentPos);

      const q = generateQuestion(realm.type, diff);
      gameState.currentQuestion = q;

      // Sync โจทย์ไปยัง Firebase
      updateRoomDB();

      document.getElementById('q-text').innerText = q.text;
      document.getElementById('q-answer').value = '';
      document.getElementById('q-answer').focus();

      document.getElementById('modal-realm-tag').innerText = `${realm.icon} ${realm.name}`;
    }

    function submitAnswer() {
      const userAns = parseFloat(document.getElementById('q-answer').value);
      const q = gameState.currentQuestion;
      const pIdx = gameState.turn;
      const player = gameState.players[pIdx];

      if (userAns === q.ans) {
        playSound('correct');
        const reward = currentDifficulty === 'easy' ? 10 : (currentDifficulty === 'medium' ? 20 : 30);
        player.crystal = (player.crystal || 0) + reward;
        alert(`ถูกต้อง! รับคริสตัล +${reward} 💎`);
      } else {
        if (player.shield) {
          player.shield = false;
          alert(`คำตอบไม่ถูกต้อง (เฉลย: ${q.ans} N) แต่โล่ป้องกันช่วยคุณไว้!`);
        } else {
          alert(`ผิด! คำตอบที่ถูกต้องคือ ${q.ans} N`);
        }
      }

      document.getElementById('modal-question').classList.add('hidden');
      gameState.turn = gameState.turn === 0 ? 1 : 0; // สลับตา
      updateRoomDB();
    }

    // --- Shop System ---
    function openShopModal() {
      const list = document.getElementById('shop-items-list');
      list.innerHTML = '';

      SHOP_ITEMS.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.style.cssText = "display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #0f172a; padding: 10px; border-radius: 8px;";
        itemDiv.innerHTML = `
          <div>
            <strong>${item.name}</strong> (${item.cost} 💎)
            <p style="font-size: 12px; color: #94a3b8;">${item.desc}</p>
          </div>
          <button class="btn" style="padding: 6px 12px; font-size: 12px;" onclick="buyShopItem('${item.id}')">ซื้อ</button>
        `;
        list.appendChild(itemDiv);
      });

      document.getElementById('modal-shop').classList.remove('hidden');
    }

    function closeShopModal() {
      document.getElementById('modal-shop').classList.add('hidden');
    }

    function buyShopItem(itemId) {
      const pIdx = gameState.turn;
      const player = gameState.players[pIdx];
      const itemData = SHOP_ITEMS.find(i => i.id === itemId);

      if (!player.crystal || player.crystal < itemData.cost) {
        return alert('คริสตัลไม่พอ!');
      }

      player.crystal -= itemData.cost;
      if (!player.inventory) player.inventory = [];
      player.inventory.push(itemId);

      alert(`ซื้อ ${itemData.name} สำเร็จ!`);
      updateRoomDB();
      openShopModal();
    }
  </script>
</body>
</html>
